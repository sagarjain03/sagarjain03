<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d9ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="220" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- LEFT TERMINAL -->
  <g>
    <rect x="15" y="15" width="370" height="190" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle cx="32" cy="32" r="5" fill="#ff5f56"/>
    <circle cx="48" cy="32" r="5" fill="#ffbd2e"/>
    <circle cx="64" cy="32" r="5" fill="#27c93f"/>
    <text x="200" y="36" fill="#8b949e" font-size="12" text-anchor="middle">fullstack.sh</text>
    <line x1="15" y1="48" x2="385" y2="48" stroke="#30363d"/>

    <text x="30" y="75" fill="#00d9ff" font-size="13" opacity="0">
      $ npm run dev
      <animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0;0.02;0.08;0.9;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="100" fill="#c8d3fc" font-size="13" opacity="0">
      ✓ Server running on :3000
      <animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0;0.1;0.16;0.9;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="130" fill="#00d9ff" font-size="13" opacity="0">
      $ git push origin main
      <animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0;0.2;0.26;0.9;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="155" fill="#c8d3fc" font-size="13" opacity="0">
      ✓ Deployed to production
      <animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0;0.3;0.36;0.9;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <rect x="30" y="172" width="8" height="14" fill="#00d9ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- DIVIDER -->
  <rect x="398" y="10" width="4" height="200" fill="url(#divider)"/>

  <!-- RIGHT TERMINAL -->
  <g>
    <rect x="415" y="15" width="370" height="190" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle cx="432" cy="32" r="5" fill="#ff5f56"/>
    <circle cx="448" cy="32" r="5" fill="#ffbd2e"/>
    <circle cx="464" cy="32" r="5" fill="#27c93f"/>
    <text x="600" y="36" fill="#8b949e" font-size="12" text-anchor="middle">ai_model.py</text>
    <line x1="415" y1="48" x2="785" y2="48" stroke="#30363d"/>

    <text x="430" y="75" fill="#00d9ff" font-size="13" opacity="0">
      &gt; generate_response(prompt)
      <animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0;0.42;0.48;0.9;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="430" y="100" fill="#ffbd2e" font-size="13" opacity="0">
      ⚙ training on stack knowledge...
      <animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0;0.52;0.58;0.9;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="430" y="130" fill="#c8d3fc" font-size="13" opacity="0">
      AI: "Full-stack meets intelligence."
      <animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0;0.65;0.72;0.9;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="430" y="155" fill="#27c93f" font-size="13" opacity="0">
      ✓ Model ready — Sagar Jain
      <animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0;0.78;0.84;0.9;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <rect x="430" y="172" width="8" height="14" fill="#00d9ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
