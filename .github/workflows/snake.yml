name: generate snake animation

on:
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main                # regenerate whenever you push to main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: sagarjain03
          # monochrome to match the profile theme: white snake, greyscale grid
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ededed&color_dots=%2308080a,%23262629,%234a4a50,%23a0a0a6,%23ededed
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ededed&color_dots=%2308080a,%23262629,%234a4a50,%23a0a0a6,%23ededed

      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
